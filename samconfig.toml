version = 0.1

[default.build.parameters]
cached = true
parallel = true

[dev.deploy.parameters]
stack_name = "todo-api-dev"
s3_bucket = "todo-cloud-demo"
s3_prefix = "todo/dev"
region = "us-east-2"
capabilities = "CAPABILITY_IAM"
parameter_overrides = "Stage=dev"
confirm_changeset = true

[qa.deploy.parameters]
stack_name = "todo-api-qa"
s3_bucket = "my-sam-artifacts-bucket"
s3_prefix = "todo/qa"
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
parameter_overrides = "Stage=qa"
confirm_changeset = true

[prod.deploy.parameters]
stack_name = "todo-api-prod"
s3_bucket = "my-sam-artifacts-bucket"
s3_prefix = "todo/prod"
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
parameter_overrides = "Stage=production"
confirm_changeset = true

[local.start-api]
port = 3000
host = "127.0.0.1"
parameter_overrides = "Stage=dev"