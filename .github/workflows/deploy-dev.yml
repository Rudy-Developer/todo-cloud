name: Deploy to AWS

on:
  push:
    branches: [dev]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::413600747077:role/github-actions-role
          aws-region: us-east-2

      - name: Instalar Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Verificar versión de Python
        run: python --version

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Build SAM
        run: SAM_CLI_TELEMETRY=0 sam build

      - name: Deploy to AWS
        run: |
          sam deploy --config-env default --no-confirm-changeset --no-fail-on-empty-changeset
